name: Phone link

# Checks for the Android phone link (windows/src-tauri/src/phone_link):
# the desktop tests on Windows, and the Kotlin client against the real Rust
# server on Linux. Builds nothing that is published and uploads no artifact.

on:
  pull_request:
    paths:
      - 'windows/src-tauri/src/phone_link/**'
      - 'android/app/src/**'
      - 'docs/ANDROID_LINK.md'
      - '.github/workflows/phone-link.yml'
  push:
    branches: [main]
    paths:
      - 'windows/src-tauri/src/phone_link/**'
      - 'android/app/src/**'
      - 'docs/ANDROID_LINK.md'
      - 'docs/RELAY_LINK.md'
      - '.github/workflows/phone-link.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: windows/package-lock.json }
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: phone-link-win-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: phone-link-win-
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: cargo build --release -p coucou-hook
      - run: cargo test --workspace --locked

  interop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: System libraries the Tauri app compiles against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-layer-shell-dev libsoup-3.0-dev libssl-dev libxdo-dev
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: phone-link-linux-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: phone-link-linux-
      - name: Rust tests (Linux)
        working-directory: windows
        run: |
          cargo build --release -p coucou-hook
          cargo test --workspace --locked
      # (Upstream runs its Android app's Kotlin interop test here. This fork's android/ is another app
      # — SmartIsland-based, docs/MONOREPO.md — so that step is left out.)

  # Upstream also runs its relay (android/relay) and its Android app here. This fork's android/ is
  # another app (SmartIsland-based, see docs/MONOREPO.md), so those jobs are left out.
